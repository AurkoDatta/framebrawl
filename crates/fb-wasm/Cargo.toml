[package]
name = "fb-wasm"
description = "WebAssembly bindings for framebrawl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fb-client = { path = "../fb-client" }
fb-host = { path = "../fb-host" }
fb-net = { path = "../fb-net" }
fb-rollback = { path = "../fb-rollback" }
fb-sim = { path = "../fb-sim" }
# Must match the wasm-bindgen CLI version used to generate the JS glue.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
